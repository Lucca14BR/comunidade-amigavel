<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Amigável</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Design Flat 2D e Arredondado */
        :root {
            --bg-principal: #f0f4f8;
            --bg-chat: #ffffff;
            --texto-principal: #1a1a1a;
            --cor-tema: #3498db; 
            --sombra-flat: 0px 4px 0px rgba(0,0,0,0.1);
            --borda-raio: 18px;
            --borda-raio-pequeno: 12px;
            --fonte-padrao: 'Segoe UI', system-ui, sans-serif;
        }
        
        .tema-escuro {
            --bg-principal: #121212;
            --bg-chat: #1e1e1e;
            --texto-principal: #ffffff;
            --sombra-flat: 0px 4px 0px rgba(0,0,0,0.4);
        }

        /* Tema Hacker/Terminal */
        .tema-hacker {
            --bg-principal: #000000 !important;
            --bg-chat: #050505 !important;
            --texto-principal: #00ff00 !important;
            --cor-tema: #00ff00 !important;
            --sombra-flat: none !important;
            --borda-raio: 0px !important;
            --borda-raio-pequeno: 0px !important;
            --fonte-padrao: 'Courier New', Courier, monospace !important;
        }
        .tema-hacker * { box-shadow: none !important; border-color: #00ff00 !important; }
        .tema-hacker .balao { background: transparent !important; border: 1px solid #00ff00 !important; color: #00ff00 !important; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--fonte-padrao); }
        body { background-color: var(--bg-principal); color: var(--texto-principal); transition: 0.3s; }
        
        .tela { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background-color: var(--bg-chat); position: relative; }
        
        /* Botões e Caixas */
        .caixa-padrao { padding: 35px; text-align: center; margin: auto; width: 90%; }
        .input-bonito { display: block; margin: 10px auto 20px auto; padding: 15px; width: 100%; background: var(--bg-principal); color: var(--texto-principal); border: none; border-radius: var(--borda-raio-pequeno); outline: none; font-size: 1rem; box-shadow: inset 0px 2px 5px rgba(0,0,0,0.05); }
        .btn-acao { padding: 15px 20px; background: var(--cor-tema); color: #fff; border: none; border-radius: var(--borda-raio); cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; font-size: 1rem; box-shadow: var(--sombra-flat); transition: 0.2s; }
        .btn-acao:active { transform: translateY(4px); box-shadow: none; }

        /* Headers */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--bg-chat); z-index: 10; border-bottom: 2px solid var(--bg-principal); }
        .avatar { width: 45px; height: 45px; background-color: var(--cor-tema); display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; border-radius: 50%; box-shadow: var(--sombra-flat); }
        .btn-icone { background: var(--bg-principal); border: none; cursor: pointer; font-size: 1.2em; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--sombra-flat); }
        
        /* Contatos */
        .lista-contatos { flex: 1; overflow-y: auto; padding: 15px; }
        .contato-item { padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; background: var(--bg-principal); border-radius: var(--borda-raio); font-weight: 600; box-shadow: var(--sombra-flat); transition: 0.2s;}
        .contato-item:hover { transform: translateX(5px); background: var(--cor-tema); color: #fff; }
        
        /* Chat Area */
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; position: relative; }
        .balao { max-width: 80%; padding: 14px 18px; word-wrap: break-word; color: #fff; font-weight: 500; cursor: pointer; border-radius: 20px; box-shadow: var(--sombra-flat); }
        .enviada { background-color: var(--cor-tema); align-self: flex-end; border-bottom-right-radius: 0px; }
        .recebida { background-color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 0px; }
        .tema-escuro .recebida { background-color: #3a3a3a; }
        .meta-dados { display: flex; justify-content: flex-end; gap: 5px; font-size: 0.7em; margin-top: 5px; opacity: 0.8; }
        
        /* Jogos, Sistema e Imagens */
        .balao-sistema { align-self: center; background: transparent; color: var(--cor-tema); border: 2px solid var(--cor-tema); border-radius: var(--borda-raio); font-size: 0.85em; font-weight: bold; padding: 10px 20px; max-width: 90%; text-align: center; box-shadow: none; }
        .sticker-img { font-size: 5rem; line-height: 1; background: transparent !important; box-shadow: none !important; }
        .img-chat { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }
        
        /* Mini Painel de Comandos (Auto-completar) */
        #painelComandos { 
            display: none; position: absolute; bottom: 80px; left: 15px; right: 15px; 
            background: var(--bg-chat); border: 2px solid var(--bg-principal); 
            border-radius: var(--borda-raio-pequeno); box-shadow: 0 -4px 15px rgba(0,0,0,0.1); 
            max-height: 220px; overflow-y: auto; z-index: 100;
        }
        .comando-item { padding: 12px 15px; border-bottom: 2px solid var(--bg-principal); cursor: pointer; font-size: 0.9em; transition: 0.2s; }
        .comando-item:hover { background: var(--bg-principal); padding-left: 20px; }
        .comando-item b { color: var(--cor-tema); font-size: 1.1em; margin-right: 5px; }

        /* Painel Stickers e Input */
        #painelStickers { display: none; padding: 15px; background: var(--bg-principal); gap: 10px; flex-wrap: wrap; justify-content: center; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .sticker-btn { font-size: 2.2rem; background: var(--bg-chat); border: none; border-radius: 15px; padding: 10px; cursor: pointer; box-shadow: var(--sombra-flat); }
        .sticker-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .input-area { display: flex; padding: 15px; background-color: var(--bg-chat); gap: 10px; align-items: center; border-top: 2px solid var(--bg-principal);}
        .input-area input { flex: 1; padding: 15px; border: none; background: var(--bg-principal); color: var(--texto-principal); border-radius: 30px; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);}
        .input-area button { background: var(--cor-tema); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2em; box-shadow: var(--sombra-flat); }

        .aviso-id { font-size: 0.85em; color: #e74c3c; font-weight: bold; margin-bottom: 15px; min-height: 20px;}
    </style>
</head>
<body>

    <!-- Onboarding -->
    <div id="tela-onboarding" class="tela" style="display: flex; justify-content: center;">
        <div class="caixa-padrao">
            <h1 style="margin-bottom: 5px;">Comunidade Amigável</h1>
            <p style="margin-bottom: 25px; font-size: 0.9em; opacity: 0.7;">Crie seu perfil</p>
            <input type="text" id="setupNome" class="input-bonito" placeholder="Seu Nome de Exibição">
            <input type="text" id="setupID" class="input-bonito" placeholder="ID Único (Ex: dev123)" style="text-transform: lowercase;">
            <input type="color" id="setupCor" value="#3498db" style="width:100%; height:50px; border:none; border-radius: 10px; margin-bottom: 20px; cursor: pointer;">
            <button class="btn-acao" onclick="criarPerfil()">Entrar na Rede</button>
        </div>
    </div>

    <!-- Contatos -->
    <div id="tela-contatos" class="tela">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="avatar">👤</div>
                <div><h3 id="displayMeuNome">Nome</h3><small style="opacity: 0.6;" id="displayMeuID">@id</small></div>
            </div>
            <button class="btn-icone" onclick="abrirConfiguracoes()">⚙️</button>
        </div>
        <div style="padding: 20px;">
            <input type="text" id="novoContatoInput" class="input-bonito" placeholder="Digite o @ID do amigo para adicionar">
            <button class="btn-acao" onclick="adicionarContatoManual()">Adicionar Amigo</button>
        </div>
        <div class="lista-contatos" id="listaContatosArea"></div>
    </div>

    <!-- Configurações -->
    <div id="tela-configuracoes" class="tela">
        <div class="header">
            <button class="btn-icone" onclick="fecharConfiguracoes()">🔙</button>
            <h3>Configurações</h3>
            <div style="width: 45px;"></div>
        </div>
        <div style="padding: 30px; overflow-y: auto;">
            <label style="font-weight: bold;">Nome de Exibição:</label>
            <input type="text" id="configNome" class="input-bonito">
            
            <label style="font-weight: bold;">Seu ID Único (@):</label>
            <input type="text" id="configID" class="input-bonito" style="text-transform: lowercase;">
            <div id="mensagemAvisoID" class="aviso-id"></div>

            <label style="font-weight: bold;">Cor do Tema:</label>
            <input type="color" id="configCor" style="width:100%; height:50px; border:none; border-radius: 10px; margin: 10px 0 20px 0; cursor:pointer;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 15px; background: var(--bg-principal); border-radius: var(--borda-raio-pequeno);">
                <strong>Modo Escuro</strong>
                <button class="btn-icone" style="width: 45px; height: 45px;" onclick="alternarTemaConfig()">🌗</button>
            </div>
            <button class="btn-acao" onclick="salvarConfiguracoes()" id="btnSalvarConfig">Salvar Alterações</button>
        </div>
    </div>

    <!-- Chat -->
    <div id="tela-chat" class="tela">
        <div class="header">
            <button class="btn-icone" onclick="voltarParaContatos()">🔙</button>
            <h3 id="nomeContatoAtivo">Contato</h3>
            <div class="avatar" style="width: 35px; height: 35px; font-size: 15px;">👤</div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>

        <!-- Mini Painel de Comandos Flutuante -->
        <div id="painelComandos"></div>

        <!-- Figurinhas Flat -->
        <div id="painelStickers">
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '🦫')">🦫</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '♟️')">♟️</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '🎮')">🎮</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '💻')">💻</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '😎')">😎</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '🚀')">🚀</button>
            <button class="sticker-btn" onclick="enviarMensagemEspecial('sticker', '💀')">💀</button>
        </div>

        <div class="input-area">
            <button onclick="toggleStickers()" style="background: var(--bg-principal); color: var(--texto-principal); box-shadow: none;" title="Figurinhas">🌠</button>
            <input type="text" id="inputMensagem" placeholder="Escreva... (Digite / para comandos)" oninput="monitorarComandos()" onkeypress="lidarEnter(event)">
            <button onclick="processarEnvio()">➢</button>
        </div>
    </div>

    <script>
        let perfil = { nome: "", id: "", cor: "#3498db", escuro: false };
        let contatos = [], historico = {}, clienteMqtt = null, contatoAtualID = "";
        let avisosID = 0, idOriginal = "";

        // LISTA DE COMANDOS DO MINI PAINEL
        const listaComandos = [
            { cmd: '/slot', desc: '🎰 Gira um Caça-níqueis' },
            { cmd: '/ppt', desc: '✂️ Joga Pedra, Papel, Tesoura' },
            { cmd: '/moeda', desc: '🪙 Joga Cara ou Coroa' },
            { cmd: '/roll', desc: '🎲 Rola um dado padrão' },
            { cmd: '/roll 20', desc: '🎲 Rola um dado de 20 lados' },
            { cmd: '/cartas', desc: '🃏 Puxa uma carta do baralho' },
            { cmd: '/roleta', desc: '🎡 Gira a roleta do cassino' },
            { cmd: '/bingo', desc: '🎱 Sorteia uma bola de bingo' },
            { cmd: '/xadrez', desc: '♟️ Sorteia um lance tático aleatório' },
            { cmd: '/capivara', desc: '🦫 Conta o que uma capivara está fazendo' },
            { cmd: '/bola8', desc: '🔮 Responde à sua pergunta' },
            { cmd: '/hacker', desc: '💻 Ativa o modo Terminal Escuro' }
        ];

        window.onload = () => {
            if (localStorage.getItem("CA_Contatos")) contatos = JSON.parse(localStorage.getItem("CA_Contatos"));
            if (localStorage.getItem("CA_Historico")) historico = JSON.parse(localStorage.getItem("CA_Historico"));
            const d = localStorage.getItem("CA_Perfil");

            if (d) {
                perfil = JSON.parse(d);
                aplicarEstilosVisuais();
                iniciarMQTT();
                navegarPara("tela-contatos");
            } else {
                navegarPara("tela-onboarding");
            }
        };

        // --- SISTEMA DE COMANDOS (AUTO-COMPLETAR) ---
        function monitorarComandos() {
            const txt = document.getElementById("inputMensagem").value.toLowerCase();
            const painel = document.getElementById("painelComandos");
            
            if (txt.startsWith('/')) {
                const filtrados = listaComandos.filter(c => c.cmd.startsWith(txt) || txt === '/');
                if (filtrados.length > 0) {
                    painel.style.display = 'block';
                    painel.innerHTML = filtrados.map(c => 
                        `<div class="comando-item" onclick="selecionarComando('${c.cmd}')"><b>${c.cmd}</b> ${c.desc}</div>`
                    ).join('');
                } else {
                    painel.style.display = 'none';
                }
            } else {
                painel.style.display = 'none';
            }
        }

        function selecionarComando(cmd) {
            const input = document.getElementById("inputMensagem");
            input.value = cmd + (cmd === '/bola8' ? ' ' : '');
            input.focus();
            document.getElementById("painelComandos").style.display = 'none';
        }

        // --- GESTÃO DE PERFIL ---
        function formatarID(t) { return t.toLowerCase().replace(/[^a-z0-9_]/g, ''); }

        function criarPerfil() {
            const n = document.getElementById("setupNome").value.trim();
            const i = formatarID(document.getElementById("setupID").value);
            if(!n || !i) return;
            perfil = { nome: n, id: i, cor: document.getElementById("setupCor").value, escuro: false };
            localStorage.setItem("CA_Perfil", JSON.stringify(perfil));
            aplicarEstilosVisuais();
            iniciarMQTT();
            navegarPara("tela-contatos");
        }

        function aplicarEstilosVisuais() {
            document.documentElement.style.setProperty('--cor-tema', perfil.cor);
            document.body.classList.toggle("tema-escuro", perfil.escuro);
            document.getElementById("displayMeuNome").innerText = perfil.nome;
            document.getElementById("displayMeuID").innerText = "@" + perfil.id;
            renderizarLista();
        }

        function abrirConfiguracoes() {
            document.getElementById("configNome").value = perfil.nome;
            document.getElementById("configID").value = perfil.id;
            document.getElementById("configCor").value = perfil.cor;
            idOriginal = perfil.id; avisosID = 0;
            document.getElementById("mensagemAvisoID").innerText = "";
            document.getElementById("btnSalvarConfig").innerText = "Salvar Alterações";
            navegarPara("tela-configuracoes");
        }
        
        function fecharConfiguracoes() { navegarPara("tela-contatos"); }
        function alternarTemaConfig() { perfil.escuro = !perfil.escuro; localStorage.setItem("CA_Perfil", JSON.stringify(perfil)); aplicarEstilosVisuais(); }

        function salvarConfiguracoes() {
            const n = document.getElementById("configNome").value.trim();
            const i = formatarID(document.getElementById("configID").value);
            const c = document.getElementById("configCor").value;
            if(!n || !i) return;

            if (i === idOriginal) { efetivarSalvamento(n, i, c); return; }

            const avisoBox = document.getElementById("mensagemAvisoID");
            const btn = document.getElementById("btnSalvarConfig");

            if (avisosID === 0) { avisoBox.innerText = "Aviso 1/2: Mudar ID limpará sua presença na lista dos outros."; avisosID = 1; btn.innerText = "Confirmar Aviso"; }
            else if (avisosID === 1) { avisoBox.innerText = "Aviso 2/2: Confirmar Ping na rede."; avisosID = 2; btn.innerText = "Verificar e Salvar"; }
            else if (avisosID === 2) {
                avisoBox.innerText = "Verificando se o ID está livre...";
                verificarDisponibilidadeID(i, (livre) => {
                    if (livre) efetivarSalvamento(n, i, c);
                    else { avisoBox.innerText = "ERRO: ID já em uso!"; avisosID = 0; btn.innerText = "Salvar Alterações"; }
                });
            }
        }

        function efetivarSalvamento(n, i, c) {
            if (i !== perfil.id && clienteMqtt) { clienteMqtt.unsubscribe(`comun/inbox/${perfil.id}`); clienteMqtt.subscribe(`comun/inbox/${i}`); }
            perfil = { nome: n, id: i, cor: c, escuro: perfil.escuro };
            localStorage.setItem("CA_Perfil", JSON.stringify(perfil));
            aplicarEstilosVisuais(); fecharConfiguracoes();
        }

        // --- SISTEMA MQTT ---
        function iniciarMQTT() {
            if(clienteMqtt) clienteMqtt.end();
            clienteMqtt = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            clienteMqtt.on('connect', () => clienteMqtt.subscribe(`comun/inbox/${perfil.id}`));

            clienteMqtt.on('message', (topic, message) => {
                const msg = JSON.parse(message.toString());
                
                if (msg.tipo === 'ping_check') { clienteMqtt.publish(`comun/inbox/${msg.remetente}`, JSON.stringify({ tipo: 'pong_check' })); return; }

                const rID = msg.remetenteID;
                if (!contatos.find(c => c.id === rID) && rID !== perfil.id && rID) {
                    contatos.push({ id: rID, nome: msg.remetenteNome || rID });
                    localStorage.setItem("CA_Contatos", JSON.stringify(contatos)); renderizarLista();
                }

                if (msg.tipo === 'mensagem' || msg.tipo === 'sticker' || msg.tipo === 'rpg') {
                    salvarHistorico(rID, msg, false);
                    if (contatoAtualID === rID) renderizarBalãoGeral(msg, false);
                }
            });
        }

        function verificarDisponibilidadeID(idTestado, callback) {
            const h = (topic, msg) => { if (JSON.parse(msg.toString()).tipo === 'pong_check') { clearTimeout(to); clienteMqtt.removeListener('message', h); callback(false); } };
            clienteMqtt.on('message', h);
            clienteMqtt.publish(`comun/inbox/${idTestado}`, JSON.stringify({ tipo: 'ping_check', remetente: perfil.id }));
            const to = setTimeout(() => { clienteMqtt.removeListener('message', h); callback(true); }, 1500);
        }

        function adicionarContatoManual() {
            const i = formatarID(document.getElementById("novoContatoInput").value);
            if (i && i !== perfil.id && !contatos.find(c => c.id === i)) {
                contatos.push({ id: i, nome: i }); localStorage.setItem("CA_Contatos", JSON.stringify(contatos));
                document.getElementById("novoContatoInput").value = ""; renderizarLista();
                if(clienteMqtt) clienteMqtt.publish(`comun/inbox/${i}`, JSON.stringify({ tipo: 'ping_add', remetenteID: perfil.id, remetenteNome: perfil.nome }));
            }
        }

        function renderizarLista() {
            const div = document.getElementById("listaContatosArea"); div.innerHTML = "";
            contatos.forEach(c => div.innerHTML += `<div class="contato-item" onclick="abrirChat('${c.id}', '${c.nome}')"><div class="avatar" style="width:35px; height:35px; font-size:16px;">👤</div><div>${c.nome} <br><small style="opacity:0.6; font-weight:normal;">@${c.id}</small></div></div>`);
        }

        function abrirChat(id, nome) {
            contatoAtualID = id; document.getElementById("nomeContatoAtivo").innerText = nome;
            document.getElementById("chatArea").innerHTML = ""; document.getElementById("painelComandos").style.display = 'none';
            if(historico[id]) historico[id].forEach(msg => renderizarBalãoGeral(msg, msg.souEu));
            navegarPara("tela-chat");
        }

        function salvarHistorico(id, msg, souEu) {
            if(!historico[id]) historico[id] = []; historico[id].push({...msg, souEu});
            if(historico[id].length > 50) historico[id].shift(); localStorage.setItem("CA_Historico", JSON.stringify(historico));
        }

        // --- SISTEMA DE JOGOS & TERMINAL ---
        function processarEnvio() {
            const input = document.getElementById("inputMensagem");
            let texto = input.value.trim();
            if (!texto || !clienteMqtt.connected) return;

            const cmd = texto.toLowerCase();
            document.getElementById("painelComandos").style.display = 'none';

            if (cmd === '/hacker' || cmd === '/kali') { document.body.classList.toggle('tema-hacker'); input.value = ""; return; }
            
            if (cmd.startsWith('/roll') || cmd === '/dado') {
                const max = parseInt(cmd.replace(/[^0-9]/g, '')) || 6;
                enviarMensagemEspecial('rpg', `🎲 Rolou um d${max} e tirou: ${Math.floor(Math.random() * max) + 1}`);
                input.value = ""; return;
            }
            if (cmd === '/moeda') { enviarMensagemEspecial('rpg', `🪙 Jogou uma moeda e caiu: ${Math.random() > 0.5 ? "Cara" : "Coroa"}`); input.value = ""; return; }
            if (cmd === '/ppt') {
                const op = ['🪨 Pedra', '📄 Papel', '✂️ Tesoura'];
                enviarMensagemEspecial('rpg', `jokenpô! Tirou: ${op[Math.floor(Math.random() * op.length)]}`);
                input.value = ""; return;
            }
            if (cmd === '/bingo') {
                const l = ['B', 'I', 'N', 'G', 'O'];
                enviarMensagemEspecial('rpg', `🎱 Sorteou a bola: ${l[Math.floor(Math.random()*l.length)]}-${Math.floor(Math.random()*75)+1}`);
                input.value = ""; return;
            }
            if (cmd === '/cartas') {
                const c = ['Ás', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'Valete', 'Dama', 'Rei'];
                const n = ['♠️ Espadas', '♥️ Copas', '♣️ Paus', '♦️ Ouros'];
                enviarMensagemEspecial('rpg', `🃏 Puxou uma carta: ${c[Math.floor(Math.random()*c.length)]} de ${n[Math.floor(Math.random()*n.length)]}`);
                input.value = ""; return;
            }
            if (cmd === '/roleta') {
                const num = Math.floor(Math.random() * 37);
                const cor = num === 0 ? '🟢 Verde' : (num % 2 === 0 ? '🔴 Vermelho' : '⚫ Preto');
                enviarMensagemEspecial('rpg', `🎡 A roleta parou em: ${num} (${cor})`);
                input.value = ""; return;
            }
            if (cmd === '/xadrez') {
                // Sorteia um lance ou solta um clássico
                const lances = ['Peão E4 ♟️', 'Bispo C4 ♗', 'Torre D1 ♖', 'Rainha H5 ♕', 'Cavalo F3 🐴'];
                enviarMensagemEspecial('rpg', `♟️ Lance sugerido pelo bot: ${lances[Math.floor(Math.random()*lances.length)]}`);
                input.value = ""; return;
            }
            if (cmd === '/capivara') {
                const cp = ['🦫 A capivara entrou na piscina e está relaxando.', '🦫 A capivara está mastigando capim.', '🦫 Uma tropa de capivaras atravessou a rua!', '🦫 A capivara fez amizade com um pássaro.'];
                enviarMensagemEspecial('rpg', cp[Math.floor(Math.random()*cp.length)]);
                input.value = ""; return;
            }
            if (cmd.startsWith('/bola8')) {
                const r = ['Com certeza!', 'Sem dúvida.', 'Concentre-se e pergunte de novo.', 'Não conte com isso.', 'Minhas fontes dizem não.'];
                enviarMensagemEspecial('rpg', `🔮 A Bola 8 responde: "${r[Math.floor(Math.random() * r.length)]}"`);
                input.value = ""; return;
            }
            if (cmd === '/slot') {
                const i = ['🍒', '🍋', '🍇', '💎'];
                const s1 = i[Math.floor(Math.random()*i.length)], s2 = i[Math.floor(Math.random()*i.length)], s3 = i[Math.floor(Math.random()*i.length)];
                enviarMensagemEspecial('rpg', `girou o Caça-Níqueis: [ ${s1} | ${s2} | ${s3} ] ${(s1===s2 && s2===s3) ? '🎰 JACKPOT!' : ''}`);
                input.value = ""; return;
            }

            texto = texto.substring(0, 1000).replace(/[\u0300-\u036f]/g, "");
            texto = texto.replace(/(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp))/gi, `<img src="$1" class="img-chat">`);
            enviarMensagemEspecial('mensagem', texto);
            input.value = "";
        }

        function enviarMensagemEspecial(tipo, conteudo) {
            if (!clienteMqtt.connected) return;
            const msg = { tipo: tipo, remetenteID: perfil.id, remetenteNome: perfil.nome, texto: conteudo, horario: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            clienteMqtt.publish(`comun/inbox/${contatoAtualID}`, JSON.stringify(msg));
            salvarHistorico(contatoAtualID, msg, true);
            renderizarBalãoGeral(msg, true);
            document.getElementById("painelStickers").style.display = "none";
        }

        function renderizarBalãoGeral(msg, souEu) {
            const chat = document.getElementById("chatArea");
            let c = souEu ? "balao enviada" : "balao recebida";
            let txt = msg.texto;

            if (msg.tipo === 'sticker') c = "balao sticker-img";
            else if (msg.tipo === 'rpg') { c = "balao-sistema"; txt = `<strong>${msg.remetenteNome}</strong> ${msg.texto}`; }

            chat.insertAdjacentHTML('beforeend', `<div class="${c}">${txt} <div class="meta-dados">${msg.horario} ${souEu && msg.tipo !== 'rpg' ? '<span class="vv">✓✓</span>' : ''}</div></div>`);
            chat.scrollTop = chat.scrollHeight;
        }

        // --- UTILITÁRIOS ---
        function toggleStickers() { const p = document.getElementById("painelStickers"); p.style.display = p.style.display === "flex" ? "none" : "flex"; }
        function lidarEnter(e) { if (e.key === "Enter") processarEnvio(); }
        function voltarParaContatos() { navegarPara("tela-contatos"); }
        function navegarPara(id) { document.querySelectorAll(".tela").forEach(t => t.style.display = "none"); document.getElementById(id).style.display = "flex"; }
    </script>
</body>
</html>
